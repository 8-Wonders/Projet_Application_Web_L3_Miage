<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Clicker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <main class="clicker-section">
            
            <div class="ide-container">
                <div class="ide-sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" y1="9" x2="6" y2="21"/></svg>
                </div>
                <div class="ide-editor" id="ide-editor">
                    <div class="ide-line-numbers" id="ide-line-numbers">1</div>
                    <div class="ide-code" id="ide-code"></div>
                </div>
            </div>

            <div class="stats">
                <h1>Lines of Code: <span id="loc-count">0</span></h1>
                <p><span id="lps-count">0</span> LOC/second</p>
                <p class="small-stat"><span id="lpc-count">1</span> LOC/click</p>
                <p id="status-text" style="font-size: 0.8rem; margin-top: 10px;"></p>
                <p id="synergy-text" style="font-size: 0.8rem; color: #bd93f9;"></p>
            </div>
            
            <button id="main-clicker" class="keyboard-btn">
                <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="10" y="30" width="80" height="40" rx="5" />
                    <line x1="25" y1="45" x2="25" y2="45" stroke-width="8" />
                    <line x1="40" y1="45" x2="40" y2="45" stroke-width="8" />
                    <line x1="55" y1="45" x2="55" y2="45" stroke-width="8" />
                    <line x1="75" y1="45" x2="75" y2="45" stroke-width="8" />
                    <line x1="30" y1="55" x2="70" y2="55" stroke-width="8" />
                </svg>
            </button>
        </main>

        <aside class="upgrades-section">
            <h2>Upgrades</h2>
            <div id="upgrades-container">
                </div>
        </aside>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
