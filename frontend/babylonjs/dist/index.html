<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Jeu auto chess</title>
    <script type="module" crossorigin src="/assets/index-BvklAjLo.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B2k4wSU4.css">
  </head>
  <body>
    <div class="overlay" id="sidePicker">
      <div class="overlay-card">
        <div class="panel-title">Choose Your Color</div>
        <p class="overlay-text">
          Pick a side to start placing pieces. The AI will auto-fill the
          opposite side.
        </p>
        <div class="overlay-actions">
          <button class="piece-btn" id="pickWhite">Play White</button>
          <button class="piece-btn" id="pickBlack">Play Black</button>
        </div>
      </div>
    </div>
    <div class="overlay hidden" id="moveModal">
      <div class="overlay-card move-card">
        <div class="panel-title" id="moveTitle">Piece movement</div>
        <p class="overlay-text" id="moveText"></p>
        <div class="overlay-actions">
          <button class="piece-btn" id="closeMove">Close</button>
        </div>
      </div>
    </div>
    <div class="layout">
      <aside class="sidebar">
        <div class="panel-title">Piece Picker</div>
        <div class="budget-row">
          <div class="budget" id="budgetWhite">❤️ 100 | ⭐ Lvl: 1 | 🪙 Gold: 10</div>
        </div>
        <div class="picker">
          <div class="picker-grid">
            <div class="piece-group" id="shopGroup">
              <div class="group-title">Shop</div>
              <button class="piece-btn" id="shop-0"></button>
              <button class="piece-btn" id="shop-1"></button>
              <button class="piece-btn" id="shop-2"></button>
              <button class="piece-btn" id="shop-3"></button>
              <button class="piece-btn" id="shop-4"></button>
              <button class="piece-btn" id="rerollShop" style="grid-column: 1 / -1; background: #2a1b35;">Reroll (💎 2)</button>
            </div>
          </div>
          <div class="preview-panel">
            <div class="preview-title">Preview</div>
            <div class="preview-name" id="previewName">Select a piece</div>
            <canvas id="previewCanvas"></canvas>
            <button class="piece-btn" id="buyPieceBtn" style="display: none; background-color: #2843a6; margin-bottom: 5px;">Buy Piece</button>
            <button class="piece-btn" id="aboutMove">About move</button>
          </div>
        </div>
        <button class="clear-btn" id="clearBoard">Clear Board</button>
        <button class="clear-btn" id="startBattle" style="background-color: #d32f2f; margin-top: 10px;">Fight!</button>
        <div class="hint">Click a piece, then click a square to place it.</div>
      </aside>
      <main class="stage">
        <canvas id="renderCanvas"></canvas>
        <div class="analysis-bar hidden" id="analysisBar">
          <div class="analysis-fill" id="analysisFill"></div>
        </div>
        <div class="playback-controls hidden" id="playbackControls">
          <button class="playback-btn" id="btnPrevTurn" title="Previous Move (Left Arrow)">◀</button>
          <span class="turn-counter" id="turnCounterText">Turn 0 / 0</span>
          <button class="playback-btn" id="btnNextTurn" title="Next Move (Right Arrow)">▶</button>
        </div>
      </main>
    </div>
    <div id="toastContainer" class="toast-container"></div>
    <div class="overlay hidden" id="dialogModal">
      <div class="overlay-card move-card">
        <div class="panel-title" id="dialogTitle">Notice</div>
        <p class="overlay-text" id="dialogText"></p>
        <div class="overlay-actions">
          <button class="piece-btn" id="closeDialogBtn">OK</button>
        </div>
      </div>
    </div>
  </body>
</html>
