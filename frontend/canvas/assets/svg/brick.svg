<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Base brick color -->
  <rect width="64" height="64" fill="#a0522d" />
  
  <!-- Mortar (warm beige-brown) - horizontal layers -->
  <rect x="0" y="0" width="64" height="3" fill="#deb887" />
  <rect x="0" y="20" width="64" height="3" fill="#deb887" />
  <rect x="0" y="40" width="64" height="3" fill="#deb887" />
  <rect x="0" y="60" width="64" height="3" fill="#deb887" />

  <!-- Staggered vertical mortar lines -->
  <!-- Row 1 (y 0-20) -->
  <rect x="0" y="0" width="3" height="20" fill="#deb887" />
  <rect x="30" y="0" width="3" height="20" fill="#deb887" />
  
  <!-- Row 2 (y 20-40) - staggered -->
  <rect x="15" y="20" width="3" height="20" fill="#deb887" />
  <rect x="45" y="20" width="3" height="20" fill="#deb887" />
  
  <!-- Row 3 (y 40-60) -->
  <rect x="0" y="40" width="3" height="20" fill="#deb887" />
  <rect x="30" y="40" width="3" height="20" fill="#deb887" />
</svg>
