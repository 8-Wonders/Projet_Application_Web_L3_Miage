<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 16 16">
  <!-- Dragon looking LEFT (body leaning left) - mirrored + mirrored lean -->
  <!-- Scales: emerald green, accents: dark teal, belly lighter -->
  <g transform="scale(-1,1) translate(-16,0)">
    <!-- Hind legs (mirrored, short clawed) -->
    <!-- Original left leg becomes right after mirror -->
    <rect x="4.1" y="10.1" width="2.1" height="5" rx="0.4" fill="#1E6B4E" stroke="#263238" stroke-width="0.35"/>
    <!-- Claw details -->
    <path d="M 4.1,14.8 L 3.3,15.1 L 4.1,15.4" fill="transparent" stroke="#263238" stroke-width="0.3"/>
    <!-- Original right leg becomes left after mirror -->
    <rect x="7.4" y="10.1" width="2.1" height="5" rx="0.4" fill="#1E6B4E" stroke="#263238" stroke-width="0.35"/>
    <!-- Claw details -->
    <path d="M 7.4,14.8 L 8.2,15.1 L 7.4,15.4" fill="transparent" stroke="#263238" stroke-width="0.3"/>

    <!-- Upper body group: leaning LEFT -->
    <g transform="translate(8,7.2) rotate(-8) translate(-8,-7.2)">
      <!-- Dragon body (scaled, thick) -->
      <rect x="4.5" y="5" width="4.8" height="6.5" rx="1.1" fill="#26A96B" stroke="#263238" stroke-width="0.4"/>
      <!-- Belly scales (lighter) -->
      <rect x="5.1" y="5.8" width="3.6" height="5.2" rx="1" fill="#4ED8A0" stroke="none" opacity="0.85"/>

      <!-- Tail (curving behind, now on right side after mirror) -->
      <path d="M 4.5,9.5 Q 2.8,10.8 2.1,12.5 Q 1.8,14 3.5,14.5" fill="transparent" stroke="#263238" stroke-width="1.1" stroke-linejoin="round"/>
      <!-- Tail spikes -->
      <polygon points="3.1,11.8 2.4,11.1 2.4,12.4" fill="#1E6B4E" stroke="none"/>
      <polygon points="2.4,13.1 1.7,12.4 1.7,13.7" fill="#1E6B4E" stroke="none"/>

      <!-- Neck and head (long snout) -->
      <!-- Neck -->
      <rect x="7.1" y="3.1" width="3" height="3.5" rx="0.9" fill="#26A96B" stroke="#263238" stroke-width="0.35" transform="rotate(-12 8 4.5)"/>
      <!-- Head (elongated) -->
      <ellipse cx="10.8" cy="2.9" rx="3.1" ry="1.85" fill="#26A96B" stroke="#263238" stroke-width="0.4" transform="rotate(-18 9.5 3.1)"/>
      <!-- Snout tip -->
      <polygon points="13.1,2.4 14.5,2.1 13.8,3.6" fill="#26A96B" stroke="#263238" stroke-width="0.3"/>

      <!-- Horns (back horn now visible on top) -->
      <path d="M 9.1,1.1 L 9.5,-0.3 L 10.4,0.9 Z" fill="#1E6B4E" stroke="#263238" stroke-width="0.25"/>

      <!-- Eye (now on left side after mirror - looking left) - fierce slit -->
      <ellipse cx="11.9" cy="2.6" rx="0.45" ry="0.65" fill="#1C2C38"/>
      <!-- Eye highlight (angry glare) -->
      <line x1="11.5" y1="2.55" x2="12.3" y2="2.55" stroke="#FFF" stroke-width="0.18"/>

      <!-- Wing (folded on back, now on right side after mirror) -->
      <!-- Wing membrane -->
      <path d="M 4.8,4.1 L 3.1,2.8 L 4.1,6.5 L 5.5,5.8 Z" fill="#1E6B4E" stroke="#263238" stroke-width="0.35"/>
      <!-- Wing bones / membrane lines -->
      <line x1="4.8" y1="4.1" x2="3.5" y2="3.1" stroke="#263238" stroke-width="0.25"/>
      <line x1="4.8" y1="4.1" x2="3.8" y2="5.4" stroke="#263238" stroke-width="0.25"/>

      <!-- Foreleg / arm (short, clawed, now on left side after mirror) -->
      <path d="M 8.1,6.1 L 10.2,7.8" fill="transparent" stroke="#26A96B" stroke-width="1.4" stroke-linecap="round"/>
      <!-- Foreclaw -->
      <polygon points="10.1,7.4 10.8,6.9 11.1,7.9" fill="#1E6B4E" stroke="none"/>
    </g>
  </g>
</svg>
